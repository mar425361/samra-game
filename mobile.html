<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم - صدام الأفكار مع عمار الدمار</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; padding-bottom: 50px; direction: rtl; }
        h2 { text-align: center; color: #f59e0b; margin-bottom: 15px; font-weight: 900; }
        
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; background: #1e293b; padding: 10px; border-radius: 12px; border: 1px solid #334155; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 14px; cursor: pointer; padding: 8px; font-weight: 700; transition: 0.2s; }
        .tab-btn.active { color: #f59e0b; border-bottom: 2px solid #f59e0b; }
        
        .panel { display: none; }
        .panel.active { display: block; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 0.9rem; font-weight: 700; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
        
        button.btn-main { width: 100%; padding: 12px; background: #f59e0b; border: none; color: #000; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: 0.2s; }
        button.btn-main:active { transform: scale(0.97); opacity: 0.9; }
        
        .member-row { display: flex; gap: 5px; margin-bottom: 8px; }
        .btn-small { padding: 5px 12px; background: #ef4444; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: 700; }
        
        .players-picker-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .picker-box { flex: 1; background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; }
        .picker-box h4 { margin: 0 0 10px 0; font-size: 14px; color: #38bdf8; text-align: center; font-weight: 700; }
        .player-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 130px; overflow-y: auto; }
        .chip { background: #0f172a; border: 1px solid #475569; color: #cbd5e1; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .chip:hover { background: #3b82f6; color: #fff; }
        .chip.selected { background: #10b981; border-color: #34d399; color: #fff; font-weight: bold; box-shadow: 0 0 10px rgba(16,185,129,0.4); }

        .modern-score-panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .teams-score-row { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
        .team-score-card { flex: 1; background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #475569; }
        .team-score-card.t1 { border-right: 4px solid #3b82f6; }
        .team-score-card.t2 { border-right: 4px solid #f59e0b; }
        .team-score-title { font-size: 0.85rem; color: #94a3b8; font-weight: 700; }
        .team-score-value { font-size: 2rem; font-weight: 900; color: #fff; margin: 5px 0; }
        .streak-indicator { font-size: 0.75rem; color: #fde047; margin-top: 4px; font-weight: 700; background: #334155; padding: 2px 6px; border-radius: 4px; display: inline-block; }
        
        .quick-award-btn { background: #10b981; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; width: 100%; margin-bottom: 5px; }
        .btn-minus { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; width: 100%; }

        .perk-management-box { background: #1e293b; border: 1px solid #f59e0b; border-radius: 12px; padding: 12px; margin-bottom: 15px; text-align: center; }
        .perk-management-box h4 { color: #f59e0b; margin-bottom: 8px; font-size: 14px; }
        .perk-status-text { font-size: 13px; color: #cbd5e1; margin-bottom: 8px; }

        .next-q-box { background: #1e293b; padding: 12px; border-radius: 8px; border: 1px dashed #f59e0b; margin-bottom: 10px; font-size: 13px; color: #fde047; text-align: center; line-height: 1.5; }
        .btn-change-q { background: #64748b; color: #fff; margin-bottom: 15px; display: none; }
        hr { border-color: #334155; margin: 20px 0; }
    </style>
</head>
<body>

    <h2>📱 لوحة تحكم المايسترو</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">الفرق والأعضاء</button>
        <button class="tab-btn" onclick="switchTab(1)">إدارة المواجهة</button>
    </div>

    <!-- التاب الأول: الفرق والأعضاء -->
    <div class="panel active">
        <div class="form-group">
            <label>اسم الفريق الأول:</label>
            <input type="text" id="team1Name" value="فريق الصقور">
        </div>
        <div class="form-group">
            <label>أعضاء الفريق الأول:</label>
            <div id="t1MembersContainer">
                <div class="member-row"><input type="text" class="t1-member" placeholder="اسم العضو"></div>
            </div>
            <button class="btn-small" style="background:#10b981; margin-top:5px;" onclick="addMemberField('t1MembersContainer', 't1-member')">+ إضافة عضو</button>
        </div>

        <hr>

        <div class="form-group">
            <label>اسم الفريق الثاني:</label>
            <input type="text" id="team2Name" value="فريق النمور">
        </div>
        <div class="form-group">
            <label>أعضاء الفريق الثاني:</label>
            <div id="t2MembersContainer">
                <div class="member-row"><input type="text" class="t2-member" placeholder="اسم العضو"></div>
            </div>
            <button class="btn-small" style="background:#10b981; margin-top:5px;" onclick="addMemberField('t2MembersContainer', 't2-member')">+ إضافة عضو</button>
        </div>

        <button class="btn-main" onclick="saveTeamsAndSync()">حفظ وتحديث أسماء الفرق والأعضاء</button>
    </div>

    <!-- التاب الثاني: المواجهة والأسئلة -->
    <div class="panel">
        <div class="form-group">
            <label>الفئة الحالية:</label>
            <select id="categorySelect"></select>
        </div>

        <div class="next-q-box" id="previewBox">اضغط على عجلة الحظ للبدء!</div>
        
        <button class="btn-main btn-change-q" id="changeQBtn" onclick="changeQuestionLocally()">🔄 تغيير السؤال (سؤال بديل)</button>

        <button class="btn-main" style="background: #ef4444; margin-top: 0; font-size: 17px;" onclick="spinTheWheel()">🎡 تدوير عجلة الحظ لاختيار الفئة</button>
        <button class="btn-main" style="background: #8b5cf6; margin-top: 8px; font-size: 17px;" onclick="spinPerksWheel()">🎁 تدوير عجلة المساعدات</button>

        <!-- لوحة إدارة المساعدات المحفوظة للفريقين -->
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <div class="perk-management-box" style="flex:1;">
                <h4 id="perkBoxTitle1">فريق الصقور</h4>
                <div class="perk-status-text" id="t1PerkText">لا توجد مساعدة</div>
                <button class="btn-small" style="background:#3b82f6; width:100%; display:none;" id="t1UsePerkBtn" onclick="usePerk(1)">✨ استخدام المساعدة</button>
            </div>
            <div class="perk-management-box" style="flex:1;">
                <h4 id="perkBoxTitle2">فريق النمور</h4>
                <div class="perk-status-text" id="t2PerkText">لا توجد مساعدة</div>
                <button class="btn-small" style="background:#f59e0b; color:#000; width:100%; display:none;" id="t2UsePerkBtn" onclick="usePerk(2)">✨ استخدام المساعدة</button>
            </div>
        </div>

        <hr>

        <label style="margin-bottom: 8px;">اختر المتنافسين بناءً على الفئة:</label>
        <div class="players-picker-container">
            <div class="picker-box">
                <h4 id="t1LabelDisplay">فريق الصقور</h4>
                <div class="player-chips" id="t1ChipsContainer"></div>
            </div>
            <div class="picker-box">
                <h4 id="t2LabelDisplay">فريق النمور</h4>
                <div class="player-chips" id="t2ChipsContainer"></div>
            </div>
        </div>

        <div class="form-group" style="display:none;">
            <input type="text" id="player1Input">
            <input type="text" id="player2Input">
        </div>

        <button class="btn-main" style="background:#3b82f6;" onclick="sendNomination()">⚔️ بدء المواجهة (تصادم اللاعبين)</button>
        
        <hr>

        <button class="btn-main" style="background:#8b5cf6;" onclick="showQuestion()">❓ إظهار السؤال على الشاشة</button>
        <button class="btn-main" style="background:#10b981;" onclick="showAnswer()">💡 إظهار الإجابة الصحيحة</button>

        <hr>

        <div class="modern-score-panel">
            <label style="margin-bottom: 10px; color: #f59e0b;">⚡ نظام النقاط السريع:</label>
            <div class="form-group" style="margin-bottom: 12px;">
                <label style="font-size: 0.8rem;">قيمة السؤال الحالي:</label>
                <select id="questionPointsValue" style="padding: 8px; font-size: 0.9rem;">
                    <option value="1">1 نقطة (سؤال عادي)</option>
                    <option value="2">نقاط مضاعفة (2)</option>
                    <option value="3">تحدي خاص (3 نقاط)</option>
                </select>
            </div>

            <div class="teams-score-row">
                <div class="team-score-card t1">
                    <div class="team-score-title" id="scoreCardT1Name">الفريق الأول</div>
                    <div class="team-score-value" id="liveScore1">0</div>
                    <div class="streak-indicator" id="streak1Display">الستريك: 0/3 🔥</div>
                    <button class="quick-award-btn" onclick="awardPoints(1)" style="margin-top: 8px;">+ منح</button>
                    <button class="btn-minus" onclick="deductPoints(1)">-1 خطأ</button>
                </div>
                <div class="team-score-card t2">
                    <div class="team-score-title" id="scoreCardT2Name">الفريق الثاني</div>
                    <div class="team-score-value" id="liveScore2">0</div>
                    <div class="streak-indicator" id="streak2Display">الستريك: 0/3 🔥</div>
                    <button class="quick-award-btn" onclick="awardPoints(2)" style="background: #f59e0b; color: #0f172a; margin-top: 8px;">+ منح</button>
                    <button class="btn-minus" onclick="deductPoints(2)">-1 خطأ</button>
                </div>
            </div>
            <button class="btn-small" style="background: #475569; width: 100%; padding: 8px; font-size: 0.85rem;" onclick="resetScores()">🔄 تصفير النقاط والستريك</button>
        </div>
    </div>

    <script>
        const socket = io("https://samra-server.onrender.com");
        const roomName = "samra_room_1";

        socket.on('connect', () => {
            socket.emit('join_room', roomName);
        });

        let questionBank = {};
        let currentCat = "", currentQ = "", currentA = "";
        let selectedPlayer1 = "";
        let selectedPlayer2 = "";
        let score1 = 0, score2 = 0;
        let streak1 = 0, streak2 = 0; // عدادات الستريك
        let team1Perk = "";
        let team2Perk = "";
        let lastPerkWinnerTeam = 1;

        fetch('questions.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => { questionBank = data; populateCategories(); })
            .catch(error => console.error('خطأ في تحميل الأسئلة:', error));

        function populateCategories() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '';
            for (const category in questionBank) {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            }
        }

        function switchTab(index) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel')[index].classList.add('active');
            document.querySelectorAll('.tab-btn')[index].classList.add('active');
            if(index === 1) { updatePlayerChips(); updateScoreCardNames(); }
        }

        function updateScoreCardNames() {
            const t1 = document.getElementById('team1Name').value || "الفريق الأول";
            const t2 = document.getElementById('team2Name').value || "الفريق الثاني";
            document.getElementById('scoreCardT1Name').innerText = t1;
            document.getElementById('perkBoxTitle1').innerText = t1;
            document.getElementById('scoreCardT2Name').innerText = t2;
            document.getElementById('perkBoxTitle2').innerText = t2;
        }

        function addMemberField(containerId, className) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'member-row';
            div.innerHTML = `<input type="text" class="${className}" placeholder="اسم العضو"><button class="btn-small" onclick="removeRow(this)">-</button>`;
            container.appendChild(div);
        }

        function removeRow(btn) { btn.parentElement.remove(); }

        function updatePlayerChips() {
            const t1Name = document.getElementById('team1Name').value || "الفريق الأول";
            const t2Name = document.getElementById('team2Name').value || "الفريق الثاني";
            document.getElementById('t1LabelDisplay').innerText = t1Name;
            document.getElementById('t2LabelDisplay').innerText = t2Name;

            const t1Members = Array.from(document.querySelectorAll('.t1-member')).map(i => i.value).filter(v => v.trim() !== "");
            const t2Members = Array.from(document.querySelectorAll('.t2-member')).map(i => i.value).filter(v => v.trim() !== "");

            const t1Container = document.getElementById('t1ChipsContainer');
            const t2Container = document.getElementById('t2ChipsContainer');

            t1Container.innerHTML = t1Members.length === 0 ? '<span style="color:#64748b; font-size:12px;">لم تدخل أعضاء</span>' : "";
            t1Members.forEach(name => {
                const chip = document.createElement('div');
                chip.className = 'chip' + (selectedPlayer1 === name ? ' selected' : '');
                chip.innerText = name;
                chip.onclick = () => { selectedPlayer1 = name; document.getElementById('player1Input').value = name; updatePlayerChips(); };
                t1Container.appendChild(chip);
            });

            t2Container.innerHTML = t2Members.length === 0 ? '<span style="color:#64748b; font-size:12px;">لم تدخل أعضاء</span>' : "";
            t2Members.forEach(name => {
                const chip = document.createElement('div');
                chip.className = 'chip' + (selectedPlayer2 === name ? ' selected' : '');
                chip.innerText = name;
                chip.onclick = () => { selectedPlayer2 = name; document.getElementById('player2Input').value = name; updatePlayerChips(); };
                t2Container.appendChild(chip);
            });
        }

        function spinTheWheel() {
            const categories = Object.keys(questionBank);
            if(categories.length === 0) return;
            socket.emit('game_action', { room: roomName, action: 'SPIN_WHEEL' });
            document.getElementById('previewBox').innerHTML = "🎡 عجلة الحظ تدور الآن على الشاشة الكبيرة...";
            document.getElementById('changeQBtn').style.display = 'none';

            setTimeout(() => {
                const randomCat = categories[Math.floor(Math.random() * categories.length)];
                document.getElementById('categorySelect').value = randomCat;
                currentCat = randomCat;
                const list = questionBank[randomCat];
                const rand = list[Math.floor(Math.random() * list.length)];
                currentQ = rand.q;
                currentA = rand.a;

                document.getElementById('previewBox').innerHTML = `<b>الفئة:</b> <span style="color:#38bdf8">${currentCat}</span><br><b>السؤال:</b> ${currentQ}<br><span style="color:#34d399"><b>الجواب:</b> ${currentA}</span>`;
                document.getElementById('changeQBtn').style.display = 'block';
                socket.emit('game_action', { room: roomName, action: 'SHOW_CATEGORY', cat: currentCat });
            }, 3000);
        }

        function changeQuestionLocally() {
            if (!currentCat || !questionBank[currentCat]) return;
            const list = questionBank[currentCat];
            const rand = list[Math.floor(Math.random() * list.length)];
            currentQ = rand.q;
            currentA = rand.a;
            document.getElementById('previewBox').innerHTML = `<b>الفئة:</b> <span style="color:#38bdf8">${currentCat}</span><br><b>السؤال <span style="color:#ef4444">(بديل)</span>:</b> ${currentQ}<br><span style="color:#34d399"><b>الجواب:</b> ${currentA}</span>`;
        }

        function spinPerksWheel() {
            // قائمة المساعدات بدون "تخطي السؤال" ومع تعديل الهدية المفاجئة لتصبح نقطة واحدة
            const perksList = ["🎯 الهدية المفاجئة (+ نقطة واحدة)", "👥 استشارة الفريق (60 ثانية)", "⭐ نقطة مضاعفة"];
            const randomPerk = perksList[Math.floor(Math.random() * perksList.length)];
            
            lastPerkWinnerTeam = lastPerkWinnerTeam === 1 ? 2 : 1; 

            if(lastPerkWinnerTeam === 1) {
                team1Perk = randomPerk;
                document.getElementById('t1PerkText').innerText = randomPerk;
                document.getElementById('t1UsePerkBtn').style.display = 'block';
            } else {
                team2Perk = randomPerk;
                document.getElementById('t2PerkText').innerText = randomPerk;
                document.getElementById('t2UsePerkBtn').style.display = 'block';
            }

            socket.emit('game_action', { room: roomName, action: 'SPIN_PERKS_WHEEL' });
            socket.emit('game_action', { room: roomName, action: 'UPDATE_PERK', team: lastPerkWinnerTeam, perk: randomPerk });
            
            document.getElementById('previewBox').innerHTML = `🎁 <span style="color:#10b981">مساعدة جديدة لـ (الفريق ${lastPerkWinnerTeam}):</span> <b>${randomPerk}</b>`;
        }

        function usePerk(teamNum) {
            let perkText = teamNum === 1 ? team1Perk : team2Perk;
            
            if(perkText.includes("استشارة")) {
                socket.emit('game_action', { room: roomName, action: 'START_CONSULTATION_TIMER' });
            }

            alert("تم تطبيق المساعدة بنجاح: " + perkText);

            if(teamNum === 1) {
                team1Perk = "";
                document.getElementById('t1PerkText').innerText = "لا توجد مساعدة";
                document.getElementById('t1UsePerkBtn').style.display = 'none';
                socket.emit('game_action', { room: roomName, action: 'UPDATE_PERK', team: 1, perk: null });
            } else {
                team2Perk = "";
                document.getElementById('t2PerkText').innerText = "لا توجد مساعدة";
                document.getElementById('t2UsePerkBtn').style.display = 'none';
                socket.emit('game_action', { room: roomName, action: 'UPDATE_PERK', team: 2, perk: null });
            }
        }

        function awardPoints(teamNumber) {
            const pointsValue = parseInt(document.getElementById('questionPointsValue').value) || 1;
            
            if(teamNumber === 1) {
                score1 += pointsValue;
                document.getElementById('liveScore1').innerText = score1;
                
                streak1++;
                if(streak1 >= 3) {
                    streak1 = 0;
                    alert("🔥 فريق الصقور حقق 3 إجابات صحيحة ورا بعض! تدور عجلة الحظ تلقائياً الآن!");
                    spinTheWheel();
                }
                document.getElementById('streak1Display').innerText = `الستريك: ${streak1}/3 🔥`;
                streak2 = 0;
                document.getElementById('streak2Display').innerText = `الستريك: ${streak2}/3 🔥`;

            } else {
                score2 += pointsValue;
                document.getElementById('liveScore2').innerText = score2;
                
                streak2++;
                if(streak2 >= 3) {
                    streak2 = 0;
                    alert("🔥 فريق النمور حقق 3 إجابات صحيحة ورا بعض! تدور عجلة الحظ تلقائياً الآن!");
                    spinTheWheel();
                }
                document.getElementById('streak2Display').innerText = `الستريك: ${streak2}/3 🔥`;
                streak1 = 0;
                document.getElementById('streak1Display').innerText = `الستريك: ${streak1}/3 🔥`;
            }

            socket.emit('game_action', { room: roomName, action: 'SCORE', s1: score1, s2: score2 });
        }

        function deductPoints(teamNumber) {
            if(teamNumber === 1) {
                score1 = Math.max(0, score1 - 1);
                document.getElementById('liveScore1').innerText = score1;
                streak1 = 0; // انكسار الستريك عند الخطأ
                document.getElementById('streak1Display').innerText = `الستريك: ${streak1}/3 🔥`;
            } else {
                score2 = Math.max(0, score2 - 1);
                document.getElementById('liveScore2').innerText = score2;
                streak2 = 0; // انكسار الستريك عند الخطأ
                document.getElementById('streak2Display').innerText = `الستريك: ${streak2}/3 🔥`;
            }
            socket.emit('game_action', { room: roomName, action: 'SCORE', s1: score1, s2: score2 });
        }

        function resetScores() {
            if(confirm("هل أنت متأكد من تصفير النقاط والستريك؟")) {
                score1 = 0; score2 = 0;
                streak1 = 0; streak2 = 0;
                document.getElementById('liveScore1').innerText = 0;
                document.getElementById('liveScore2').innerText = 0;
                document.getElementById('streak1Display').innerText = `الستريك: 0/3 🔥`;
                document.getElementById('streak2Display').innerText = `الستريك: 0/3 🔥`;
                socket.emit('game_action', { room: roomName, action: 'SCORE', s1: 0, s2: 0 });
            }
        }

        function saveTeamsAndSync() {
            const t1Members = Array.from(document.querySelectorAll('.t1-member')).map(i => i.value).filter(v => v.trim() !== "");
            const t2Members = Array.from(document.querySelectorAll('.t2-member')).map(i => i.value).filter(v => v.trim() !== "");
            socket.emit('game_action', {
                room: roomName, action: 'UPDATE_TEAMS',
                t1: document.getElementById('team1Name').value,
                t2: document.getElementById('team2Name').value,
                m1: t1Members, m2: t2Members
            });
            updateScoreCardNames();
            switchTab(1);
            alert("تم حفظ وتحديث الفرق والأعضاء بنجاح!");
        }

        function sendNomination() {
            const p1 = document.getElementById('player1Input').value;
            const p2 = document.getElementById('player2Input').value;
            if(!p1 || !p2) { alert("الرجاء اختيار لاعب من الفريق الأول ولاعب من الفريق الثاني أولاً!"); return; }
            socket.emit('game_action', { room: roomName, action: 'NOMINATE', cat: currentCat || document.getElementById('categorySelect').value, p1: p1, p2: p2 });
        }

        function showQuestion() {
            const isConsult = team1Perk.includes("استشارة") || team2Perk.includes("استشارة");
            socket.emit('game_action', { room: roomName, action: 'SHOW_Q', q: currentQ, a: currentA, isConsultation: isConsult });
        }

        function showAnswer() {
            socket.emit('game_action', { room: roomName, action: 'SHOW_A' });
        }
    </script>
</body>
</html>
